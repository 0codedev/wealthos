name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create Release Notes
        id: release_notes
        run: |
          echo "Automated Production Release for WealthOS v2 (${{ github.ref_name }})" > release_notes.md
          echo "" >> release_notes.md
          echo "### Highlights" >> release_notes.md
          echo "- Institutional-grade personal finance operating system & quantitative trading terminal" >> release_notes.md
          echo "- Real-time multi-broker telemetry (Upstox Pro WebSocket, DhanHQ)" >> release_notes.md
          echo "- Python Bridge high-frequency analytics and Black-Scholes Greeks calculation" >> release_notes.md
          echo "- Parent-threaded Telegram telemetry topic router" >> release_notes.md
          echo "- Local-first privacy architecture with Dexie.js v30 and AES-256 storage" >> release_notes.md

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
