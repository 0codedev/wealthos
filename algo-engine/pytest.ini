[pytest]
# Test configuration for the Intraday Strategy Suite.
# Tests live in algo-engine/tests/. `pythonpath = .` makes the algo-engine root
# importable so tests can do `from strategies.base_strategy import BaseStrategy`.
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    property: property-based tests (hypothesis) validating a numbered design property.
    unit: example/edge-case unit tests.
filterwarnings =
    ignore::DeprecationWarning
