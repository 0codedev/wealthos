<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" />
    <title>Wealth Aggregator — Offline</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #0f172a;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        main {
            max-width: 28rem;
            text-align: center;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 1.5rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
        }
        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 1rem;
            border-radius: 1rem;
            background: linear-gradient(135deg, #6366f1, #f59e0b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            font-weight: 700;
            color: white;
        }
        h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
        p { margin: 0 0 1.5rem; line-height: 1.5; color: #94a3b8; }
        button {
            appearance: none;
            border: none;
            background: #6366f1;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        button:hover { background: #4f46e5; }
        .hint { font-size: 0.8rem; color: #64748b; margin-top: 1.25rem; }
    </style>
</head>
<body>
    <main>
        <div class="logo">W</div>
        <h1>You're offline</h1>
        <p>
            Wealth Aggregator is in offline mode because the network is unavailable.
            Your locally-saved data is safe — reconnect to sync latest prices &amp; insights.
        </p>
        <button type="button" onclick="window.location.reload()">Try again</button>
        <div class="hint">Cache version: wealth-aggregator-v1</div>
    </main>
</body>
</html>
