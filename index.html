      var localState = localStorage.getItem('wealth-aggregator-logic');
      var isDark = true;
      if (localState) {
        var parsed = JSON.parse(localState);
        if (parsed && parsed.state && typeof parsed.state.isDarkMode === 'boolean') {
          isDark = parsed.state.isDarkMode;
        }
      }
      var rootEl = document.documentElement;
      if (isDark) {
        rootEl.classList.add('dark');
        rootEl.setAttribute('data-theme', 'dark');
        rootEl.style.colorScheme = 'dark';
      } else {
        rootEl.classList.remove('dark');
        rootEl.setAttribute('data-theme', 'light');
        rootEl.style.colorScheme = 'light';
      }
    } catch (e) {
      document.documentElement.classList.add('dark');
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>

            devtools.open = true;
